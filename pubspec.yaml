name: myafrimall
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.0.0

  # State management
  provider: ^6.1.2

  # Fonts
  google_fonts: ^6.2.1

  # SVG support
  flutter_svg: ^2.0.10+1

flutter:
  uses-material-design: true

  assets:
    - assets/images/auth/
    - assets/images/dashboard/
    - assets/images/shared/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
