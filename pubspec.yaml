name: myafrimall
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.0.0

  # State management
  provider: ^6.1.2

  # Fonts
  google_fonts: ^6.2.1

  # SVG support
  flutter_svg: ^2.0.10+1

  # Chart surpport
  fl_chart: ^0.68.0

  # Loading effect
  shimmer: ^3.0.0

  # HTTP
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/auth/
    - assets/images/dashboard/
    - assets/images/shared/
